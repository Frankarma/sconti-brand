<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F4EE">
<title>Sconti per brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B2926; --grigio: #706B62; --grigio-chiaro: #A8A398; --linea: #E8E3D8;
    --oro: #BEA264; --oro-scuro: #85703F; --lino: #F7F4EE; --carta: #FFFFFF; --errore: #B4473A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--lino); color: var(--ink);
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 400;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 24px; }

  .sopra { display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
    font-size: 11px; font-weight: 500; letter-spacing: .22em; color: var(--oro-scuro); }
  .sopra::before { content: ""; width: 16px; height: 1.5px; background: var(--oro); }
  h1 { margin: 0; font-size: 32px; line-height: 1.08; font-weight: 300; letter-spacing: -.01em; }
  h1 b { font-weight: 600; }
  .intro { margin: 10px 0 0; color: var(--grigio); font-weight: 300; font-size: 15px; line-height: 1.45; }
  .esempio { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px;
    padding: 7px 10px; border-radius: 10px; background: var(--carta); border: 1px dashed var(--linea);
    font-size: 12.5px; color: var(--grigio); }
  .esempio b { color: var(--ink); font-weight: 500; letter-spacing: .04em; }
  .esempio .pill { padding: 2px 7px; border-radius: 6px; color: var(--ink); font-weight: 500; }

  .scheda { background: var(--carta); border-radius: 16px; padding: 14px 14px 12px; margin-top: 14px;
    box-shadow: 0 1px 2px rgba(43,41,38,.04), 0 6px 20px rgba(43,41,38,.05); }
  .scheda.base { margin-top: 22px; border: 1px solid #E9DFC8; }
  .base-tit { font-weight: 600; color: var(--oro-scuro); font-size: 15px; }
  .base-sub { font-size: 12.5px; color: var(--grigio); font-weight: 300; margin-top: 1px; }

  .testa { display: flex; align-items: center; gap: 10px; }
  .num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--lino);
    display: grid; place-items: center; font-size: 12px; font-weight: 500; color: var(--grigio); }
  .nome { flex: 1; min-width: 0; border: 0; border-bottom: 1.5px solid var(--linea); border-radius: 0;
    padding: 6px 2px; font: 600 17px/1.2 "Outfit", system-ui, sans-serif; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink); background: transparent; outline: none; }
  .nome::placeholder { text-transform: none; letter-spacing: 0; font-weight: 300; color: var(--grigio-chiaro); }
  .nome:focus { border-bottom-color: var(--oro); }
  .togli { flex: none; width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent;
    color: var(--grigio-chiaro); display: grid; place-items: center; cursor: pointer; }
  .togli:active { background: var(--lino); }

  .anni { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 12px; }
  @media (min-width: 520px) { .anni { grid-template-columns: repeat(7, 1fr); } }
  .cella { position: relative; display: block; border: 1px solid var(--linea); border-radius: 11px;
    padding: 6px 4px 4px; text-align: center; transition: background-color .25s, border-color .2s; cursor: text; }
  .cella:focus-within { border-color: var(--oro); box-shadow: 0 0 0 3px rgba(190,162,100,.18); }
  .cella.piena { border-color: transparent; }
  .cella.errore { border-color: var(--errore); box-shadow: 0 0 0 3px rgba(180,71,58,.15); }
  .anno { display: block; font-size: 11px; font-weight: 500; letter-spacing: .08em; color: var(--grigio); }
  .cella input { width: 100%; border: 0; outline: none; background: transparent; text-align: center;
    font: 500 20px/1.25 "Outfit", system-ui, sans-serif; color: var(--ink); padding: 0 12px 0 0; }
  .cella input::placeholder { color: #D6D1C6; font-weight: 300; }
  .cella .pct { position: absolute; right: 9px; bottom: 7px; font-size: 13px; color: var(--grigio); pointer-events: none; }

  .nota { width: 100%; margin-top: 10px; border: 0; border-radius: 9px; background: var(--lino);
    padding: 9px 11px; font: 400 14px/1.3 "Outfit", system-ui, sans-serif; color: var(--ink); outline: none; }
  .nota::placeholder { color: var(--grigio-chiaro); font-weight: 300; }
  .nota:focus { box-shadow: 0 0 0 2px rgba(190,162,100,.35); }

  .aggiungi { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    margin-top: 14px; padding: 15px; border: 1.5px dashed #D9CFB8; border-radius: 16px; background: transparent;
    font: 500 15px "Outfit", system-ui, sans-serif; color: var(--oro-scuro); cursor: pointer; }
  .aggiungi:active { background: #FBF8F1; }
  .ricomincia { display: block; margin: 26px auto 0; border: 0; background: none; color: var(--grigio-chiaro);
    font: 400 13px "Outfit", system-ui, sans-serif; text-decoration: underline; cursor: pointer; }

  .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(247,244,238,.86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(232,227,216,.9); }
  .barra-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .stato { flex: 1; font-size: 13px; color: var(--grigio); line-height: 1.3; }
  .stato b { color: var(--ink); font-weight: 600; }
  .btn { border: 0; border-radius: 13px; padding: 14px 22px; font: 600 15.5px "Outfit", system-ui, sans-serif;
    background: var(--ink); color: #fff; cursor: pointer; }
  .btn:active { transform: scale(.98); }
  .btn[disabled] { opacity: .45; }

  .velo { position: fixed; inset: 0; background: rgba(43,41,38,.32); z-index: 9; opacity: 0;
    pointer-events: none; transition: opacity .2s; }
  .velo.aperto { opacity: 1; pointer-events: auto; }
  .foglio { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--carta);
    border-radius: 22px 22px 0 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-width: 640px; margin: 0 auto; }
  .foglio.aperto { transform: none; }
  .maniglia { width: 38px; height: 4px; border-radius: 4px; background: var(--linea); margin: 0 auto 14px; }
  .foglio h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .foglio p { margin: 4px 0 16px; color: var(--grigio); font-size: 14px; font-weight: 300; }
  .scelta { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; margin-top: 10px;
    padding: 15px 16px; border-radius: 15px; border: 1px solid var(--linea); background: var(--carta);
    font: 500 16px "Outfit", system-ui, sans-serif; color: var(--ink); cursor: pointer; }
  .scelta.prima { background: var(--ink); color: #fff; border-color: var(--ink); }
  .scelta small { display: block; font-size: 12.5px; font-weight: 300; opacity: .75; margin-top: 1px; }
  .scelta svg { flex: none; }
  .scelta[disabled] { opacity: .5; }

  .avviso { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 20;
    transform: translate(-50%, 20px); opacity: 0; transition: all .25s; pointer-events: none;
    background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px;
    max-width: calc(100% - 32px); width: max-content; }
  .avviso.su { transform: translate(-50%, 0); opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <p class="sopra">NOI DA PICCOLI</p>
  <h1><b>Sconti</b> per brand e anno</h1>
  <p class="intro">Per ogni brand scrivi lo sconto sotto l'anno della collezione. Basta il numero. Casella vuota = nessuno sconto.</p>
  <div class="esempio" aria-label="Esempio">Esempio: <b>MAYORAL</b> 2023 <span class="pill" data-t="20">20%</span> 2025 <span class="pill" data-t="10">10%</span></div>

  <section class="scheda base" id="base">
    <div class="base-tit">Tutti gli altri brand</div>
    <div class="base-sub">Regola di base: vale per i brand che non metti nell'elenco</div>
  </section>

  <div id="lista"></div>
  <button class="aggiungi" id="aggiungi" type="button">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    Aggiungi un brand
  </button>
  <button class="ricomincia" id="ricomincia" type="button">Ricomincia da capo</button>
</main>

<div class="barra">
  <div class="barra-in">
    <div class="stato" id="stato"></div>
    <button class="btn" id="invia" type="button">Invia</button>
  </div>
</div>

<div class="velo" id="velo"></div>
<div class="foglio" id="foglio" role="dialog" aria-modal="true" aria-labelledby="foglio-tit">
  <div class="maniglia"></div>
  <h2 id="foglio-tit">Invia gli sconti</h2>
  <p id="foglio-sub"></p>
  <button class="scelta prima" id="invia-pdf" type="button" disabled>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
    <span><span id="invia-pdf-tit">Preparo il PDF…</span><small>Lo mandi su WhatsApp o per email</small></span>
  </button>
  <button class="scelta" id="invia-testo" type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>
    <span>Invia come messaggio<small>Un testo semplice su WhatsApp</small></span>
  </button>
</div>

<div class="avviso" id="avviso" role="status" aria-live="polite"></div>

<script src="compila.js"></script>
<script>
(function () {
  var ANNI = NDPSconti.ANNI;
  var CHIAVE = "ndp-sconti-brand-v1";
  var PDFLIB = "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
  var BRAND = ["ABUELA TATA","ALESSANDRO MARTINEZ","ALVIERO MARTINI","ARCENCIEL","ARTIGIANBABY","BABIDU","BABY CHICK","BABY GI","BABYBOLL","BABYDIF","BAGY LU","BARCELLINO","BÉBÉ DI ALMY","BEBE'MARGO'","BEL PICCINO","BELLA BRILLI","BIDIBIMBO","BIMBALO'","BIRILLINI","BISOU","BLOOM","BOBOLI","BUFI","CAMINITO","CANADA HOUSE","CAPPELLERIA ITALIANA","CARLO PIGNATELLI","CARRERA","CESARE PACIOTTI","CHARO","CHICCO","COCOTE","CUA-CUAK","CURTO","DAMPER DAN","DEL SUR","DEOLINDA","DILU'","ELLEPI","EVI","FINA ENJERIQUE","FIRST BABY","FOFETTES","FS BABY","GIO HIGUAMY","I DELFI","ICEBERG","IL CORREDINO","IRGE","ISABEL","JACQUES E MONIQUE","JO MILANO","JOSE' VARON","JUJUBEBE'","JULIANA","KIDIWI","KLAYDI","KOKONOKO","LA FATINA","LALALU'","LARANJINHA","LAURA BIAGIOTTI","LE CHICCHE","LE COCONNE","LES ENFANTS DE GISELE","LOVE BAG","MAGIL","MAIOLICA","MAIOS KIDS","MARCH","MARLU","MAYORAL","MIMOSA","MINI JA","MINI JATSI","MINIBANDA","MIRANDA","MLR-MAISON LES ROUCHES","MOM PUPPIES","MYSWEETPIE","NALU'","NANCY","NANNAFRUFRU'","NAZARENO GABRIELLI","NINNAOH","NISERET","NOI DA PICCOLI","PAPPA E LATTE","PASTELLO","PATACHOU","PETIT","PETIT POSH","PETITE INDI","PICCOLA DESI","PICCOLA GIUGGIOLA","PICCOLE CANAGLIE","PICCOLE MONELLE","POMPETITPOM","PONTO POR PONTO","PRETA.POR.TE","PURETE'","RIC-AMIAMOCI","RIGOLA'","SA.BA CALZATURE","SARDON","SARTORIA DEI PICCOLI","SERGENT MAJOR","SNUG","SOFIJA","STELLA","STREET MONKEY","TNY","YATSI BABY","ZOYSAN'"];

  function vuoto() { return { nome: "", sconti: ANNI.map(function () { return ""; }), nota: "" }; }
  function $(id) { return document.getElementById(id); }

  // ---- stato salvato sul telefono (se il browser lo permette) ----
  var stato = null;
  try { stato = JSON.parse(localStorage.getItem(CHIAVE)); } catch (e) {}
  if (!stato || !stato.base || !Array.isArray(stato.brand)) stato = { base: vuoto(), brand: [vuoto()] };
  if (!stato.brand.length) stato.brand.push(vuoto());
  function salva() {
    try { localStorage.setItem(CHIAVE, JSON.stringify(stato)); } catch (e) {}
    aggiornaStato();
  }

  // ---- utilita' ----
  function numero(v) { return v === "" ? NaN : Number(String(v).replace(",", ".")); }
  function colore(n) {
    var c = NDPSconti.tinta(n);
    return c ? "rgb(" + c.map(function (x) { return Math.round(x * 255); }).join(",") + ")" : "";
  }
  function haDati(b) { return b.nome.trim() || b.nota.trim() || b.sconti.some(function (s) { return s !== ""; }); }
  var tAvviso;
  function avviso(msg) {
    var a = $("avviso"); a.textContent = msg; a.classList.add("su");
    clearTimeout(tAvviso); tAvviso = setTimeout(function () { a.classList.remove("su"); }, 2600);
  }
  document.querySelectorAll(".esempio .pill").forEach(function (p) { p.style.background = colore(+p.dataset.t); });

  var dl = document.createElement("datalist"); dl.id = "elenco-brand";
  BRAND.forEach(function (b) { var o = document.createElement("option"); o.value = b; dl.appendChild(o); });
  document.body.appendChild(dl);

  // ---- costruzione delle schede ----
  function griglia(dati) {
    var g = document.createElement("div"); g.className = "anni";
    ANNI.forEach(function (anno, i) {
      var l = document.createElement("label"); l.className = "cella";
      l.innerHTML = '<span class="anno">' + anno + '</span><input type="text" inputmode="decimal" enterkeyhint="next" maxlength="4" placeholder="–" aria-label="Sconto ' + anno + '"><span class="pct">%</span>';
      var inp = l.querySelector("input");
      inp.value = dati.sconti[i];
      function dipingi() {
        var n = numero(inp.value);
        var errato = inp.value !== "" && (isNaN(n) || n > 100);
        l.classList.toggle("errore", errato);
        l.classList.toggle("piena", !errato && n > 0);
        l.style.backgroundColor = errato ? "" : colore(n);
      }
      inp.addEventListener("input", function () {
        var v = inp.value.replace(/[^0-9.,]/g, "").slice(0, 4);
        if (v !== inp.value) inp.value = v;
        dati.sconti[i] = v; dipingi(); salva();
        if (numero(v) > 100) avviso("Lo sconto va da 0 a 100");
      });
      inp.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        var tutti = Array.prototype.slice.call(document.querySelectorAll("input"));
        var dopo = tutti[tutti.indexOf(inp) + 1];
        if (dopo) dopo.focus(); else inp.blur();
      });
      dipingi();
      g.appendChild(l);
    });
    return g;
  }

  function campoNota(dati) {
    var n = document.createElement("input");
    n.className = "nota"; n.type = "text"; n.maxLength = 40; n.placeholder = "Nota (facoltativa)";
    n.value = dati.nota; n.enterKeyHint = "done";
    n.addEventListener("input", function () { dati.nota = n.value; salva(); });
    return n;
  }

  var base = $("base");
  base.appendChild(griglia(stato.base));
  base.appendChild(campoNota(stato.base));

  function schedaBrand(dati) {
    var s = document.createElement("section"); s.className = "scheda";
    s.innerHTML = '<div class="testa"><span class="num"></span>' +
      '<input class="nome" type="text" list="elenco-brand" autocapitalize="characters" autocomplete="off" spellcheck="false" enterkeyhint="next" maxlength="28" placeholder="Nome del brand">' +
      '<button class="togli" type="button" aria-label="Togli questo brand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></div>';
    var nome = s.querySelector(".nome");
    nome.value = dati.nome;
    nome.addEventListener("input", function () { dati.nome = nome.value; salva(); });
    nome.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); s.querySelector(".cella input").focus(); }
    });
    s.querySelector(".togli").addEventListener("click", function () {
      if (haDati(dati) && !confirm("Togliere " + (dati.nome.trim().toUpperCase() || "questo brand") + "?")) return;
      stato.brand.splice(stato.brand.indexOf(dati), 1);
      if (!stato.brand.length) stato.brand.push(vuoto());
      disegnaLista(); salva();
    });
    s.appendChild(griglia(dati));
    s.appendChild(campoNota(dati));
    return s;
  }

  function disegnaLista() {
    var l = $("lista"); l.innerHTML = "";
    stato.brand.forEach(function (b, i) {
      var s = schedaBrand(b);
      s.querySelector(".num").textContent = i + 1;
      l.appendChild(s);
    });
  }
  disegnaLista();

  $("aggiungi").addEventListener("click", function () {
    stato.brand.push(vuoto()); disegnaLista(); salva();
    var ultima = $("lista").lastElementChild;
    ultima.scrollIntoView({ behavior: "smooth", block: "center" });
    ultima.querySelector(".nome").focus({ preventScroll: true });
  });

  $("ricomincia").addEventListener("click", function () {
    if (!confirm("Cancellare tutto e ricominciare?")) return;
    try { localStorage.removeItem(CHIAVE); } catch (e) {}
    location.reload();
  });

  function compilati() { return stato.brand.filter(haDati); }
  function aggiornaStato() {
    var n = compilati().length;
    $("stato").innerHTML = n ? "<b>" + n + "</b> brand compilat" + (n === 1 ? "o" : "i") + "<br>salvati sul telefono"
                             : "Compila e premi <b>Invia</b>";
  }
  aggiornaStato();

  // ---- invio ----
  function controlla() {
    var tutti = [stato.base].concat(stato.brand);
    for (var i = 0; i < tutti.length; i++) {
      for (var j = 0; j < ANNI.length; j++) {
        var v = tutti[i].sconti[j], n = numero(v);
        if (v !== "" && (isNaN(n) || n > 100)) return "C'è uno sconto non valido (" + v + "): va da 0 a 100";
      }
    }
    var senzaNome = stato.brand.filter(function (b) { return haDati(b) && !b.nome.trim(); }).length;
    if (senzaNome) return "Manca il nome di " + (senzaNome === 1 ? "un brand" : senzaNome + " brand");
    var baseVuota = stato.base.sconti.every(function (s) { return s === ""; });
    if (!compilati().length && baseVuota) return "Scrivi almeno uno sconto";
    return "";
  }

  function datiPuliti() {
    return { base: stato.base, brand: compilati() };
  }

  function caricaPdfLib() {
    if (window.PDFLib) return Promise.resolve(window.PDFLib);
    return new Promise(function (ok, ko) {
      var s = document.createElement("script"); s.src = PDFLIB; s.crossOrigin = "anonymous";
      s.onload = function () { ok(window.PDFLib); };
      s.onerror = function () { ko(new Error("pdf-lib")); };
      document.head.appendChild(s);
    });
  }
  // la libreria si scarica in anticipo, cosi' l'invio e' immediato
  setTimeout(function () { caricaPdfLib().catch(function () {}); }, 1200);

  var filePronto = null;
  function nomeFile() {
    var d = new Date();
    return "Sconti_per_brand_" + d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2) + ".pdf";
  }

  function apriFoglio() {
    var problema = controlla();
    if (problema) { avviso(problema); return; }
    var n = compilati().length;
    $("foglio-sub").textContent = n > NDPSconti.RIGHE_PDF
      ? n + " brand: nel PDF ci stanno i primi " + NDPSconti.RIGHE_PDF + ", il messaggio li contiene tutti."
      : (n ? n + (n === 1 ? " brand" : " brand") + " più la regola di base." : "Solo la regola di base.");
    $("velo").classList.add("aperto"); $("foglio").classList.add("aperto");
    // Il PDF si prepara subito: il tasto "Invia il PDF" poi condivide all'istante (iPhone lo richiede)
    filePronto = null;
    $("invia-pdf").disabled = true; $("invia-pdf-tit").textContent = "Preparo il PDF…";
    Promise.all([caricaPdfLib(), fetch("Sconti_per_brand.pdf").then(function (r) { return r.arrayBuffer(); })])
      .then(function (r) { return NDPSconti.compilaPdf(r[0], r[1], datiPuliti()); })
      .then(function (bytes) {
        filePronto = new File([bytes], nomeFile(), { type: "application/pdf" });
        $("invia-pdf").disabled = false; $("invia-pdf-tit").textContent = "Invia il PDF compilato";
      })
      .catch(function () {
        $("invia-pdf-tit").textContent = "PDF non disponibile: usa il messaggio";
      });
  }
  function chiudiFoglio() { $("velo").classList.remove("aperto"); $("foglio").classList.remove("aperto"); }
  $("invia").addEventListener("click", apriFoglio);
  $("velo").addEventListener("click", chiudiFoglio);

  $("invia-pdf").addEventListener("click", function () {
    if (!filePronto) return;
    var condivisione = { files: [filePronto], title: "Sconti per brand e anno" };
    if (navigator.canShare && navigator.canShare(condivisione)) {
      navigator.share(condivisione).then(chiudiFoglio).catch(function () {});
      return;
    }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(filePronto); a.download = filePronto.name;
    document.body.appendChild(a); a.click(); a.remove();
    avviso("PDF scaricato: allegalo su WhatsApp o in una email");
    chiudiFoglio();
  });

  function riga(nome, b) {
    var parti = [];
    ANNI.forEach(function (anno, i) { if (b.sconti[i] !== "") parti.push(anno + " " + b.sconti[i].replace(".", ",") + "%"); });
    return nome + ": " + (parti.length ? parti.join(" · ") : "nessuno sconto") + (b.nota.trim() ? " (" + b.nota.trim() + ")" : "");
  }
  $("invia-testo").addEventListener("click", function () {
    var righe = ["*Sconti per brand e anno* (" + NDPSconti.oggi() + ")"];
    if (stato.base.sconti.some(function (s) { return s !== ""; }) || stato.base.nota.trim()) righe.push(riga("Tutti gli altri brand", stato.base));
    compilati().forEach(function (b) { righe.push(riga(b.nome.trim().toUpperCase(), b)); });
    window.location.href = "https://wa.me/?text=" + encodeURIComponent(righe.join("\n"));
    chiudiFoglio();
  });
})();
</script>
</body>
</html>
